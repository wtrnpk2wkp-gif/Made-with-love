
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8E8D5">
  <title>عشان إنت حبيبي ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Marhey:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: linear-gradient(
        180deg,
        #FFF5E9 0%,
        #F8E8D5 55%,
        #F3E0CC 100%
      );
      font-family: 'Cairo', sans-serif;
      color: #541820;
      overflow-x: hidden;
      position: relative;
    }

    /* القلوب المتطايرة بالبيج والبرجاندي */
    .bg-heart {
      position: fixed;
      color: rgba(107, 34, 44, 0.35);
      animation: floatUp linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.5) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* أقسام الصفحة */
    .section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    /* العنوان */
    .top-title {
      font-family: 'Marhey', cursive;
      font-size: 2.2rem;
      color: #541820;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #6B222C;
      font-weight: 600;
      margin-bottom: 25px;
      line-height: 1.8;
    }

    /* البوكس المغلق */
    .gift-closed-wrapper {
      position: relative;
      width: 200px;
      height: 190px;
      cursor: pointer;
      margin: 35px 0 30px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 15px 18px rgba(84, 24, 32, 0.18));
    }

    .gift-closed-wrapper:hover {
      transform: scale(1.05);
    }

    /* غطاء البوكس */
    .gift-lid-top {
      width: 200px;
      height: 45px;
      background: linear-gradient(
        135deg,
        #6B222C,
        #541820 55%,
        #792E3A
      );
      border-radius: 10px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 3;
      box-shadow:
        inset 0 3px 5px rgba(255,255,255,0.12),
        0 6px 14px rgba(84,24,32,0.18);
      border: 2px solid #8A4850;
    }

    .gift-lid-top::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 100%;
      background: linear-gradient(
        90deg,
        #B98770,
        #FFF0DD,
        #E7CDB6
      );
    }

    /* فيونكة كريمي */
    .gift-bow-top {
      position: absolute;
      top: -37px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 50px;
      z-index: 5;
    }

    .gift-bow-top::before,
    .gift-bow-top::after {
      content: '';
      position: absolute;
      top: 8px;
      width: 48px;
      height: 35px;
      background: linear-gradient(
        135deg,
        #FFF5E9,
        #DCC0A9,
        #F8E8D5
      );
      border: 2px solid #B98770;
      box-shadow: inset 0 2px 5px rgba(255,255,255,0.6);
    }

    .gift-bow-top::before {
      left: 0;
      border-radius: 80% 20% 65% 35%;
      transform: rotate(25deg);
    }

    .gift-bow-top::after {
      right: 0;
      border-radius: 20% 80% 35% 65%;
      transform: rotate(-25deg);
    }

    /* عقدة الفيونكة */
    .gift-bow-top {
      background: radial-gradient(
        ellipse at center,
        #E8CEB8 0%,
        #B98770 45%,
        transparent 48%
      );
    }

    /* جسم البوكس */
    .gift-body-closed {
      width: 190px;
      height: 150px;
      background: linear-gradient(
        110deg,
        #541820 0%,
        #702631 35%,
        #541820 70%,
        #7A303B 100%
      );
      border-radius: 0 0 16px 16px;
      position: absolute;
      bottom: 0;
      left: 5px;
      z-index: 1;
      box-shadow:
        inset 5px 0 12px rgba(255,255,255,0.06),
        inset -5px 0 12px rgba(0,0,0,0.08),
        0 12px 24px rgba(84,24,32,0.15);
      border: 2px solid #8A4850;
      border-top: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gift-body-closed::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 100%;
      background: linear-gradient(
        90deg,
        #B98770,
        #FFF0DD,
        #E7CDB6
      );
    }

    .heart-badge {
      position: relative;
      z-index: 2;
      background: #FFF5E9;
      border: 2px solid #B98770;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      font-size: 1.35rem;
    }

    /* زر فتح الهدية */
    .cute-pill-btn {
      background: #FFF5E9;
      color: #541820;
      border: 2px solid #B98770;
      padding: 12px 28px;
      border-radius: 50px;
      font-family: 'Marhey', cursive;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(84,24,32,0.10);
      transition: all 0.3s ease;
      animation: softBounce 2s infinite;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .cute-pill-btn:hover {
      background: #F3E0CC;
      transform: scale(1.05);
      box-shadow: 0 8px 22px rgba(84,24,32,0.16);
    }

    @keyframes softBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* البوكس المفتوح */
    .open-box-wrapper {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(
        145deg,
        #6B222C,
        #541820 55%,
        #7A303B
      );
      border-radius: 12px 12px 24px 24px;
      padding: 32px 20px 22px;
      border: 3px solid #8A4850;
      box-shadow:
        inset 0 5px 10px rgba(255,255,255,0.06),
        0 15px 35px rgba(84,24,32,0.2);
      position: relative;
      margin-top: 45px;
      margin-bottom: 25px;
    }

    /* ورق التغليف داخل البوكس */
    .open-box-wrapper::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,245,233,0.18);
      pointer-events: none;
    }

    /* الغطاء الجانبي */
    .box-lid-aside {
      position: absolute;
      top: -31px;
      left: -12px;
      width: 135px;
      height: 42px;
      background: linear-gradient(
        135deg,
        #702631,
        #541820 65%,
        #8A3D47
      );
      border: 2px solid #8A4850;
      border-radius: 10px;
      transform: rotate(-25deg);
      box-shadow: 0 6px 15px rgba(0,0,0,0.14);
      z-index: 3;
    }

    .box-lid-aside::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 100%;
      background: linear-gradient(
        90deg,
        #B98770,
        #FFF0DD,
        #E7CDB6
      );
    }

    /* فيونكة صغيرة على الغطاء الجانبي */
    .box-lid-aside::after {
      content: '♡';
      position: absolute;
      top: -27px;
      left: 48px;
      color: #F8E8D5;
      font-size: 30px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }

    /* كارت الاعتذار */
    .inner-card {
      position: relative;
      z-index: 2;
      background: linear-gradient(
        145deg,
        #FFF9F0,
        #FFF0DD
      );
      color: #541820;
      border-radius: 12px;
      padding: 30px 20px;
      box-shadow:
        inset 0 0 15px rgba(185,135,112,0.10),
        0 8px 20px rgba(0,0,0,0.12);
      border: 2px solid #D8B69D;
    }

    .card-header {
      font-family: 'Marhey', cursive;
      font-size: 1.15rem;
      color: #6B222C;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .card-body-text {
      font-size: 1.05rem;
      color: #541820;
      line-height: 2;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .card-footer {
      font-family: 'Marhey', cursive;
      font-size: 1.05rem;
      color: #6B222C;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* زر إعادة الفتح */
    .reset-btn {
      background: #FFF5E9;
      color: #541820;
      border: 2px solid #B98770;
      padding: 10px 24px;
      border-radius: 50px;
      font-family: 'Marhey', cursive;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(84,24,32,0.10);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .reset-btn:hover {
      background: #F3E0CC;
      transform: scale(1.05);
    }

    @media (max-width: 420px) {
      .top-title {
        font-size: 1.8rem;
      }

      .subtitle {
        font-size: 0.98rem;
      }

      .open-box-wrapper {
        padding: 28px 14px 18px;
      }

      .inner-card {
        padding: 25px 14px;
      }

      .card-body-text {
        font-size: 0.98rem;
      }

      .cute-pill-btn {
        font-size: 0.95rem;
        padding: 11px 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <div id="hearts-bg"></div>

  <section class="section" id="topSection">
    <h1 class="top-title">عشان إنت حبيبي ❤️</h1>

    <p class="subtitle">
      في حاجة صغيرة مستنياك جوه الهدية دي...
      <br>
      دوس عليها يا روحي ♡
    </p>

    <div class="gift-closed-wrapper" onclick="scrollToGift()" role="button" tabindex="0" aria-label="افتح الهدية">
      <div class="gift-bow-top"></div>
      <div class="gift-lid-top"></div>

      <div class="gift-body-closed">
        <div class="heart-badge">❤️</div>
      </div>
    </div>

    <button class="cute-pill-btn" onclick="scrollToGift()">
      <span>♡ دوس هنا عشان تفتح هديتك ♡</span>
    </button>
  </section>

  <section class="section" id="bottomSection">
    <div class="open-box-wrapper">
      <div class="box-lid-aside"></div>

      <div class="inner-card">
        <div class="card-header">
          ♥ من قلبي لقلبك ♥
        </div>

        <div class="card-body-text">
          أقر أنا شروق حبيبتك بغلطتي،
          <br>
          وإنه مكانش ينفع أعمل كده،
          <br>
          وأعتذر عما بدر مني.
          <br>
          عديهالي يا حياتي، مقدرش على زعلك 🥹
        </div>

        <div class="card-footer">
          توقيع: حبيبة عمار ❤️
        </div>
      </div>
    </div>

    <button class="reset-btn" onclick="scrollToTop()">
      <span>نفتحها تاني؟</span> ♡
    </button>
  </section>

  <script>
    const heartsContainer = document.getElementById('hearts-bg');
    const heartIcons = ['♥', '♡', '♥', '✦'];

    function createBgHeart() {
      const heart = document.createElement('div');
      heart.classList.add('bg-heart');
      heart.innerText =
        heartIcons[Math.floor(Math.random() * heartIcons.length)];

      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
      heart.style.fontSize = (Math.random() * 14 + 14) + 'px';

      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createBgHeart, 650);

    function scrollToGift() {
      document.getElementById('bottomSection').scrollIntoView({
        behavior: 'smooth'
      });

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 80,
          origin: { y: 0.8 },
          colors: ['#541820', '#6B222C', '#B98770', '#F8E8D5']
        });
      }
    }

    function scrollToTop() {
      document.getElementById('topSection').scrollIntoView({
        behavior: 'smooth'
      });
    }

    document.querySelector('.gift-closed-wrapper').addEventListener('keydown', function(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        scrollToGift();
      }
    });
  </script>

</body>
</html>
