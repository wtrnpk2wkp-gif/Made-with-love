<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اعتذار رسمي من حبيبتك ❣️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Marhey:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffeef4 0%, #ffd6e5 50%, #fec5bb 100%);
      font-family: 'Cairo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* القلوب الطائرة في الخلفية */
    .bg-heart {
      position: absolute;
      color: rgba(255, 143, 177, 0.45);
      animation: floatUp linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.5) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* المحتوى الرئيسي */
    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 450px;
      width: 100%;
    }

    /* العنوان علوي */
    .main-title {
      font-family: 'Marhey', cursive;
      font-size: 1.9rem;
      color: #d81b60;
      text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.9);
      margin-bottom: 25px;
      line-height: 1.4;
      animation: pulseTitle 2s ease-in-out infinite alternate;
    }

    @keyframes pulseTitle {
      0% { transform: scale(1); }
      100% { transform: scale(1.04); }
    }

    /* صندوق الهدايا */
    .gift-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      cursor: pointer;
      margin-bottom: 25px;
      transition: transform 0.3s ease;
    }

    .gift-wrapper:hover {
      transform: scale(1.05);
    }

    .gift-box {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* غطاء البوكس */
    .gift-lid {
      width: 190px;
      height: 45px;
      background: #ff8fa3;
      border-radius: 12px;
      position: absolute;
      top: 0;
      left: -5px;
      z-index: 3;
      box-shadow: 0 6px 15px rgba(216, 27, 96, 0.2);
      transition: all 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      border: 3px solid #fff;
    }

    .gift-lid::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 100%;
      background: #fff;
    }

    /* فيونكة البوكس */
    .gift-bow {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 30px;
      z-index: 4;
      transition: all 0.7s ease;
    }

    .gift-bow::before, .gift-bow::after {
      content: '';
      position: absolute;
      width: 32px;
      height: 25px;
      border: 4px solid #fff;
      border-radius: 50% 50% 0 50%;
      background: #ff758f;
    }

    .gift-bow::before {
      left: -5px;
      transform: rotate(-20deg);
    }

    .gift-bow::after {
      right: -5px;
      transform: rotate(100deg);
      border-radius: 50% 50% 50% 0;
    }

    /* جسم البوكس */
    .gift-body {
      width: 180px;
      height: 145px;
      background: #ffb3c1;
      border-radius: 0 0 16px 16px;
      position: absolute;
      bottom: 0;
      z-index: 1;
      box-shadow: 0 12px 25px rgba(255, 117, 143, 0.3);
      border: 3px solid #fff;
      border-top: none;
      overflow: hidden;
    }

    .gift-body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 100%;
      background: #fff;
    }

    /* حالة فتح البوكس */
    .open .gift-lid {
      transform: translateY(-120px) rotate(-15deg);
      opacity: 0;
    }

    .open .gift-bow {
      transform: translateX(-50%) translateY(-120px) scale(0.5);
      opacity: 0;
    }

    /* الزرار/النص تحت البوكس */
    .tap-btn {
      font-family: 'Marhey', cursive;
      font-size: 1.4rem;
      color: #fff;
      background: linear-gradient(45deg, #ff758f, #ff8fa3);
      padding: 12px 30px;
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(255, 117, 143, 0.4);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      animation: bounceBtn 1.5s infinite;
      border: 2px solid #ffffff;
    }

    .tap-btn:hover {
      transform: scale(1.08);
      background: linear-gradient(45deg, #d81b60, #ff758f);
    }

    @keyframes bounceBtn {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    /* كارت الاعتذار */
    .card-modal {
      display: none;
      opacity: 0;
      transform: scale(0.8) translateY(20px);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 25px;
      box-shadow: 0 15px 35px rgba(216, 27, 96, 0.15);
      border: 3px solid #ffe3ec;
      position: relative;
      margin-top: 10px;
      width: 100%;
    }

    .card-modal.show {
      display: block;
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .card-text {
      font-size: 1.15rem;
      color: #4a4a4a;
      line-height: 1.8;
      font-weight: 600;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .signature {
      font-family: 'Marhey', cursive;
      font-size: 1.3rem;
      color: #d81b60;
      background: #ffeef4;
      padding: 10px 18px;
      border-radius: 15px;
      display: inline-block;
      margin-top: 5px;
      border: 1px dashed #ff8fa3;
    }
  </style>
</head>
<body>

  <!-- القلوب المتطايرة في الخلفية -->
  <div id="hearts-bg"></div>

  <div class="container">
    <!-- العنوان علوي -->
    <h1 class="main-title">اعتذار رسمي من حبيبتك ❣️</h1>

    <!-- صندوق الهدايا -->
    <div class="gift-wrapper" id="giftWrapper" onclick="openGift()">
      <div class="gift-box" id="giftBox">
        <div class="gift-bow"></div>
        <div class="gift-lid"></div>
        <div class="gift-body"></div>
      </div>
    </div>

    <!-- الزرار/النص تحت البوكس -->
    <div class="tap-btn" id="tapBtn" onclick="openGift()">
      <span>دوس هنا يروحي</span> ✨
    </div>

    <!-- كارت الاعتذار -->
    <div class="card-modal" id="cardModal">
      <div class="card-text">
اقر انا شروق حبيبتك بغلطتي وانه مكانش ينفع اعمل كده واعتذر عما بدر مني عديهالي يحياتي مقدرش على زعلك
      </div>
      <div class="signature">
        توقيع : حبيبة عمار 🌸
      </div>
    </div>
  </div>

  <script>
    // إنشاء القلوب في الخلفية
    const heartsContainer = document.getElementById('hearts-bg');
    const heartIcons = ['💖', '🌸', '💕', '✨', '💗'];

    function createBgHeart() {
      const heart = document.createElement('div');
      heart.classList.add('bg-heart');
      heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
      heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createBgHeart, 400);

    // فتح البوكس وعرض الكارت
    let isOpen = false;
    function openGift() {
      if (isOpen) return;
      isOpen = true;

      const giftBox = document.getElementById('giftBox');
      const tapBtn = document.getElementById('tapBtn');
      const cardModal = document.getElementById('cardModal');

      giftBox.classList.add('open');
      tapBtn.style.display = 'none';

      // احتفال Confetti بالقلوب
      confetti({
        particleCount: 70,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#ff758f', '#ff8fa3', '#ffb3c1', '#ffffff']
      });

      setTimeout(() => {
        cardModal.classList.add('show');
      }, 400);
    }
  </script>
</body>
</html>
