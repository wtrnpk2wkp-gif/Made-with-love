
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> عشان إنت حبيبي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo & Tajawal for authentic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Theme Colors matched directly from images */
        :root {
            --bg-color: #fdf4ea;
            --burgundy-dark: #581d28;
            --burgundy-mid: #682230;
            --burgundy-light: #7a2839;
            --ribbon-light: #f3e5d8;
            --ribbon-shadow: #e2cca8;
            --text-burgundy: #581d28;
            --border-color: #bfa392;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-burgundy);
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Background Pattern of faint hearts */
        .bg-pattern {
            background-image: radial-gradient(rgba(88, 29, 40, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Animated Floating Background Hearts */
        .floating-heart {
            position: absolute;
            color: rgba(88, 29, 40, 0.12);
            pointer-events: none;
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-15px) rotate(10deg) scale(1.05); }
        }

        /* Card Shadow and Inner Depth */
        .gift-card-shadow {
            box-shadow: 0 15px 35px -5px rgba(88, 29, 40, 0.25), 0 5px 15px -5px rgba(0,0,0,0.1);
        }

        /* Smooth Lid Animation Styles */
        .gift-box-container {
            perspective: 1000px;
        }

        .gift-lid {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            transform-origin: top left;
        }

        .gift-lid.open {
            transform: translate(-45px, -65px) rotate(-28deg);
        }

        /* Gentle pulse animation for interactive elements */
        .pulse-subtle {
            animation: pulse-subtle 2.5s infinite ease-in-out;
        }

        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Custom Button Hover Effects */
        .custom-btn {
            background-color: #fcf6ee;
            border: 1.5px solid #bd9b8b;
            color: var(--text-burgundy);
            box-shadow: 0 4px 12px rgba(88, 29, 40, 0.08);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-btn:active {
            transform: scale(0.96);
            background-color: #f7ebd9;
        }

        /* Ribbon Gradient */
        .ribbon-gradient {
            background: linear-gradient(180deg, #f7ebe0 0%, #edd8c4 100%);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center p-4 sm:p-6 select-none">

    <!-- Subtle Floating Decorative Hearts in Background -->
    <div class="floating-heart text-2xl" style="top: 12%; left: 15%; animation-delay: 0s;">♡</div>
    <div class="floating-heart text-xl" style="top: 25%; right: 18%; animation-delay: 1.5s;">♡</div>
    <div class="floating-heart text-3xl" style="bottom: 20%; left: 12%; animation-delay: 3s;">♡</div>
    <div class="floating-heart text-xl" style="bottom: 15%; right: 15%; animation-delay: 4.5s;">♡</div>
    <div class="floating-heart text-lg" style="top: 55%; left: 8%; animation-delay: 2s;">♡</div>

    <!-- Main Mobile Frame Viewport -->
    <div class="w-full max-w-md min-h-[640px] flex flex-col items-center justify-between py-8 px-4 relative z-10">

        <!-- ==================== STATE 1: GIFT CLOSED ==================== -->
        <div id="state-closed" class="w-full flex flex-col items-center justify-between flex-1 transition-all duration-500 opacity-100 scale-100">
            
            <!-- Header Text -->
            <div class="text-center mt-2 space-y-2">
                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight flex items-center justify-center gap-2" style="color: var(--burgundy-dark);">
                    <span>عشان إنت حبيبي</span>
                    <span class="inline-block text-red-500 text-3xl animate-bounce" style="animation-duration: 2s;">❤️</span>
                </h1>
                
                <div class="space-y-1 pt-2">
                    <p class="text-lg sm:text-xl font-bold" style="color: var(--burgundy-dark);">
                        صنعت بكل حب والله 🥹...
                    </p>
                    <p class="text-base sm:text-lg font-semibold flex items-center justify-center gap-1 opacity-90" style="color: var(--burgundy-dark);">
                        دوس عليها يروحي <span class="text-sm">♡</span>
                    </p>
                </div>
            </div>

            <!-- Gift Box Graphic Component (Clickable) -->
            <div onclick="openGift()" class="cursor-pointer my-8 group relative flex flex-col items-center justify-center transition-transform hover:scale-105 active:scale-95">
                
                <div class="relative w-64 h-64 flex items-center justify-center">
                    <!-- Shadow Under Gift Box -->
                    <div class="absolute bottom-4 w-52 h-8 bg-black/15 rounded-[100%] blur-md transition-all duration-300 group-hover:scale-105"></div>

                    <!-- Gift Box Wrapper -->
                    <div class="relative w-56 h-56 flex flex-col items-center justify-end">
                        
                        <!-- Ribbon Bow Top (Attached to Lid) -->
                        <div class="absolute top-[18px] z-30 flex items-center justify-center space-x-[-10px] space-x-reverse">
                            <!-- Left Loop -->
                            <div class="w-10 h-6 border-2 border-[#e3cbaf] bg-[#f5e7d8] rounded-full transform -rotate-12 shadow-sm"></div>
                            <!-- Right Loop -->
                            <div class="w-10 h-6 border-2 border-[#e3cbaf] bg-[#f5e7d8] rounded-full transform rotate-12 shadow-sm"></div>
                            <!-- Center Knot -->
                            <div class="absolute w-5 h-5 bg-[#edd5bc] rounded-full border border-[#d3b493] shadow-inner"></div>
                        </div>

                        <!-- Gift Lid -->
                        <div class="z-20 w-[240px] h-12 rounded-xl shadow-md relative flex items-center justify-center" style="background-color: var(--burgundy-mid);">
                            <!-- Vertical Ribbon on Lid -->
                            <div class="w-10 h-full ribbon-gradient border-x border-black/5"></div>
                        </div>

                        <!-- Gift Box Body -->
                        <div class="w-52 h-40 rounded-b-2xl shadow-xl relative overflow-hidden flex items-center justify-center" style="background-color: var(--burgundy-dark);">
                            <!-- Vertical Ribbon on Body -->
                            <div class="w-10 h-full ribbon-gradient border-x border-black/5 relative flex items-center justify-center">
                                <!-- Red Heart Emblem Center Badge -->
                                <div class="w-9 h-9 rounded-full bg-[#f8ede1] border border-[#d8beaa] shadow-md flex items-center justify-center">
                                    <span class="text-sm transform scale-110">❤️</span>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>

            <!-- Bottom Action Button -->
            <button onclick="openGift()" class="custom-btn pulse-subtle px-8 py-3.5 rounded-full text-base sm:text-lg font-bold flex items-center justify-center gap-2 cursor-pointer w-11/12 max-w-xs">
                <span>♡</span>
                <span>دوس هنا عشان تفتح هديتك</span>
                <span>♡</span>
            </button>

        </div>


        <!-- ==================== STATE 2: GIFT OPENED (CARD REVEALED) ==================== -->
        <div id="state-opened" class="w-full flex-col items-center justify-between flex-1 transition-all duration-500 opacity-0 scale-95 hidden">
            
            <!-- Main Inner Card Box Container -->
            <div class="relative w-full max-w-sm my-auto pt-10 pb-4">
                
                <!-- Open Lid tilted at top-left -->
                <div class="absolute -top-3 -left-4 z-30 transform -rotate-12 pointer-events-none">
                    <div class="relative">
                        <!-- Bow -->
                        <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 flex items-center justify-center">
                            <div class="w-7 h-4 bg-[#f5e7d8] border border-[#d3b493] rounded-full transform -rotate-12"></div>
                            <div class="w-7 h-4 bg-[#f5e7d8] border border-[#d3b493] rounded-full transform rotate-12 -ml-2"></div>
                        </div>
                        <!-- Lid Structure -->
                        <div class="w-36 h-9 rounded-lg shadow-lg relative flex items-center justify-center overflow-hidden" style="background-color: var(--burgundy-mid);">
                            <div class="w-7 h-full ribbon-gradient"></div>
                        </div>
                    </div>
                </div>

                <!-- Outer Dark Burgundy Gift Container Envelope Frame -->
                <div class="w-full rounded-3xl p-3 shadow-2xl relative" style="background-color: var(--burgundy-dark);">
                    
                    <!-- Inner Light Cream Paper Card -->
                    <div class="w-full bg-[#fdf5eb] rounded-2xl p-6 sm:p-7 text-center space-y-4 border border-[#ecdacb] shadow-inner">
                        
                        <!-- Card Title -->
                        <h2 class="text-xl sm:text-2xl font-extrabold flex items-center justify-center gap-2 pt-1" style="color: var(--burgundy-dark);">
                            <span>❤️</span>
                            <span>بحبك اوي يموري</span>
                            <span>❤️</span>
                        </h2>

                        <!-- Card Body Message -->
                        <div class="space-y-2 text-base sm:text-lg font-bold leading-relaxed opacity-95" style="color: var(--burgundy-dark);">
                            <p>أقر أنا شروق حبيبتك بغلطتي،</p>
                            <p>وانه مكانش ينفع أعمل كده،</p>
                            <p>وبعتذر عما بدر مني.</p>
                            <p class="pt-1">عديهالي يحياتي، مقدرش على زعلك</p>
                        </div>

                        <!-- Crying/Pleading Emoji -->
                        <div class="text-3xl py-1 transform hover:scale-125 transition-transform">
                            🥹
                        </div>

                        <!-- Card Signature -->
                        <div class="pt-2 text-lg sm:text-xl font-black flex items-center justify-center gap-2" style="color: var(--burgundy-dark);">
                            <span>توقيع: حبيبة عمار</span>
                            <span class="text-red-500">❤️</span>
                        </div>

                    </div>
                </div>

            </div>

            <!-- Bottom Replay / Reset Button -->
            <button onclick="closeGift()" class="custom-btn px-8 py-3 rounded-full text-base sm:text-lg font-bold flex items-center justify-center gap-2 cursor-pointer mt-6">
                <span>♡</span>
                <span>نفتحها تاني؟</span>
                <span>♡</span>
            </button>

        </div>

    </div>

    <!-- Interactive Script for State Switching & Animation -->
    <script>
        const stateClosed = document.getElementById('state-closed');
        const stateOpened = document.getElementById('state-opened');

        function openGift() {
            // Smooth transition from closed state to opened state
            stateClosed.classList.add('opacity-0', 'scale-95');
            
            setTimeout(() => {
                stateClosed.classList.add('hidden');
                stateClosed.classList.remove('flex');
                
                stateOpened.classList.remove('hidden');
                stateOpened.classList.add('flex');
                
                // Trigger reflow to apply smooth transition
                setTimeout(() => {
                    stateOpened.classList.remove('opacity-0', 'scale-95');
                    stateOpened.classList.add('opacity-100', 'scale-100');
                }, 50);

            }, 300);
        }

        function closeGift() {
            // Smooth transition back to initial gift box state
            stateOpened.classList.add('opacity-0', 'scale-95');
            stateOpened.classList.remove('opacity-100', 'scale-100');

            setTimeout(() => {
                stateOpened.classList.add('hidden');
                stateOpened.classList.remove('flex');

                stateClosed.classList.remove('hidden');
                stateClosed.classList.add('flex');

                setTimeout(() => {
                    stateClosed.classList.remove('opacity-0', 'scale-95');
                    stateClosed.classList.add('opacity-100', 'scale-100');
                }, 50);

            }, 300);
        }
    </script>
</body>
</html>
