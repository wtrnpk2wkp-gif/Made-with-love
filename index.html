
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عشان إنت حبيبي 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Marhey:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #FDE8EF;
      font-family: 'Cairo', sans-serif;
      color: #F7B4CC;
      overflow-x: hidden;
      position: relative;
    }

    /* خلفية القلوب المتطايرة */
    .bg-heart {
      position: fixed;
      color: rgba(255, 143, 177, 0.45);
      animation: floatUp linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.5) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* أقسام الصفحة */
    .section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    /* --- الجزء العلوي --- */
    .top-title {
      font-family: 'Marhey', cursive;
      font-size: 2.2rem;
      color: #C43D76;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #C43D76;
      opacity: 0.85;
      font-weight: 600;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    /* بوكس الهدايا المغلق 3D */
    .gift-closed-wrapper {
      position: relative;
      width: 190px;
      height: 190px;
      cursor: pointer;
      margin: 10px 0 30px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .gift-closed-wrapper:hover {
      transform: scale(1.06);
    }

    .gift-lid-top {
      width: 200px;
      height: 45px;
      background: linear-gradient(135deg, #FDE8EF, #F7B4CC);
      border-radius: 12px;
      position: absolute;
      top: 0;
      left: -5px;
      z-index: 3;
      box-shadow: 0 6px 18px rgba(216, 27, 96, 0.25);
      border: 3px solid #ffffff;
    }

    .gift-lid-top::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 100%;
      background: #FDE8EF;
    }

    .gift-bow-top {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 30px;
      z-index: 4;
    }

    .gift-bow-top::before, .gift-bow-top::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 24px;
      border: 3px solid #ffffff;
      border-radius: 50% 50% 0 50%;
      background: #FDE8EF;
    }

    .gift-bow-top::before {
      left: -4px;
      transform: rotate(-20deg);
    }

    .gift-bow-top::after {
      right: -4px;
      transform: rotate(100deg);
      border-radius: 50% 50% 50% 0;
    }

    .gift-body-closed {
      width: 190px;
      height: 150px;
      background: linear-gradient(135deg, #FDE8EF, #F7B4CC);
      border-radius: 0 0 18px 18px;
      position: absolute;
      bottom: 0;
      z-index: 1;
      box-shadow: 0 12px 28px rgba(255, 117, 143, 0.35);
      border: 3px solid #ffffff;
      border-top: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gift-body-closed::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 100%;
      background: #FDE8EF;
    }

    .heart-badge {
      position: relative;
      z-index: 2;
      background: #FDE8EF;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      font-size: 1.3rem;
    }

    /* الزرار البيضاوي الرقيق */
    .cute-pill-btn {
      background: rgba(255, 255, 255, 0.85);
      color: #E96B9B;
      border: 2px solid #ffffff;
      padding: 12px 28px;
      border-radius: 50px;
      font-family: 'Marhey', cursive;
      font-size: 1.15rem;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(216, 27, 96, 0.12);
      transition: all 0.3s ease;
      animation: softBounce 2s infinite;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .cute-pill-btn:hover {
      background: #FDE8EF;
      transform: scale(1.05);
      box-shadow: 0 8px 22px rgba(216, 27, 96, 0.2);
    }

    @keyframes softBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* --- الجزء السفلي (البوكس المفتوح) --- */
    .open-box-wrapper {
      width: 100%;
      max-width: 380px;
      background: #FDE8EF;
      border-radius: 28px;
      padding: 25px 20px;
      border: 4px solid #ffffff;
      box-shadow: 0 15px 35px rgba(216, 27, 96, 0.2);
      position: relative;
      margin-bottom: 25px;
    }

    /* الغطاء المائل بجانب البوكس المفتوح */
    .box-lid-aside {
      position: absolute;
      top: -25px;
      left: -20px;
      width: 120px;
      height: 38px;
      background: #FDE8EF;
      border: 3px solid #ffffff;
      border-radius: 12px;
      transform: rotate(-25deg);
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      z-index: 3;
    }

    .box-lid-aside::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 100%;
      background: #FDE8EF;
    }

    /* كارت الاعتذار الداخلي */
    .inner-card {
      background: #FFF2F6;
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: inset 0 0 15px rgba(255, 182, 193, 0.2), 0 8px 20px rgba(0,0,0,0.05);
      border: 2px dashed #ff8fa3;
    }

    .card-header {
      font-family: 'Marhey', cursive;
      font-size: 1.15rem;
      color: #C43D76;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .card-body-text {
      font-size: 1.1rem;
      color: #4a4a4a;
      line-height: 1.9;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .card-footer {
      font-family: 'Marhey', cursive;
      font-size: 1.15rem;
      color: #C43D76;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .reset-btn {
      background: rgba(255, 255, 255, 0.9);
      color: #FDE8EF;
      border: 2px solid #ffffff;
      padding: 10px 24px;
      border-radius: 50px;
      font-family: 'Marhey', cursive;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(216, 27, 96, 0.1);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .reset-btn:hover {
      background: #ffffff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- القلوب الطائرة في الخلفية -->
  <div id="hearts-bg"></div>

  <!-- الشاشة الأولى: الجزء العلوي -->
  <section class="section" id="topSection">
    <h1 class="top-title">عشان إنت حبيبي 💕</h1>
    <p class="subtitle">في حاجة صغيرة مستنياك جوه الهدية دي...<br>دوس عليها يا روحي 🌸</p>

    <div class="gift-closed-wrapper" onclick="scrollToGift()">
      <div class="gift-bow-top"></div>
      <div class="gift-lid-top"></div>
      <div class="gift-body-closed">
        <div class="heart-badge">💖</div>
      </div>
    </div>

    <button class="cute-pill-btn" onclick="scrollToGift()">
      <span>دوس هنا عشان تفتح هديتك</span> 
    </button>
  </section>

  <!-- الشاشة الثانية: الجزء السفلي (البوكس المفتوح والكارت) -->
  <section class="section" id="bottomSection">
    <div class="open-box-wrapper">
      <div class="box-lid-aside"></div>

      <div class="inner-card">
        <div class="card-header">
          💕 بحبك اوي 💕
        </div>

        <div class="card-body-text">
          آقر أنا شروق حبيبتك بغلطتي،<br>
          وإنه مكانش ينفع أعمل كده،<br>
          وأعتذر عما بدر مني.<br>
          عديهالي يا حياتي، مقدرش على زعلك ❣️
        </div>

        <div class="card-footer">
          توقيع: حبيبة عمار 
        </div>
      </div>
    </div>

    <button class="reset-btn" onclick="scrollToTop()">
      <span>نفتحها تاني؟</span> 🔄
    </button>
  </section>

  <script>
    // إنشاء القلوب المتطايرة
    const heartsContainer = document.getElementById('hearts-bg');
    const heartIcons = ['💖', '🌸', '💕', '✨', '💗'];

    function createBgHeart() {
      const heart = document.createElement('div');
      heart.classList.add('bg-heart');
      heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
      heart.style.fontSize = (Math.random() * 14 + 14) + 'px';
      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createBgHeart, 400);

    // الانتقال للجزء السفلي عند الضغط
    function scrollToGift() {
      document.getElementById('bottomSection').scrollIntoView({ behavior: 'smooth' });

      // تأثير الاحتفال بالقصاصات والقلوب
      confetti({
        particleCount: 80,
        spread: 80,
        origin: { y: 0.8 },
        colors: ['#C43D76', '#E96B9B', '#F7B4CC', '#C43D76']
      });
    }

    // العودة للقمة
    function scrollToTop() {
      document.getElementById('topSection').scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
